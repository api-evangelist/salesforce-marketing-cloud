note: >-
  Entity graph derived from components.schemas $ref links and id-reference fields across the
  three OpenAPI documents in this repo. It therefore covers three of Marketing Cloud
  Engagement's eleven product areas — Content Builder assets, the contact model, and Journey
  Builder. The absent areas (Data Extensions, Automation Studio, Transactional Messaging,
  MobileConnect, MobilePush, Campaigns, Einstein) have no captured spec, so their entities are
  named in cross_domain_references only where a captured schema actually points at them.
  Nothing is invented from product knowledge.
identity:
  primary_key_style: mixed
  note: >-
    Marketing Cloud Engagement has NO uniform id scheme and no id prefixes. Three different
    identity styles coexist in the captured specs and an integrator must handle all three -
    an integer surrogate id (Asset.id), a string GUID id plus a separate customer-defined
    external key (Journey.id + Journey.key), and a customer-defined natural key with a
    system integer alongside it (Contact.contactKey + Contact.contactID).
  patterns:
  - {entity: Asset, key: id, type: integer, external_key: customerKey}
  - {entity: Journey, key: id, type: string, external_key: key}
  - {entity: Contact, key: contactKey, type: string, system_id: contactID}
  external_key_note: >-
    customerKey (assets) and key (journeys) are CUSTOMER-DEFINED external keys. They are the
    stable handle for automation and the field most integrations should address, because the
    system id is not portable across business units or environments.
