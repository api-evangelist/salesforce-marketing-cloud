naftiko: 1.0.0-alpha2
info:
  label: Salesforce Marketing Cloud Automation
  description: Unified workflow for digital marketers to manage contacts, orchestrate customer journeys, and automate multi-channel
    campaigns across email, SMS, and push channels.
  tags:
  - Salesforce
  - Marketing Automation
  - Customer Journey
  - Email Marketing
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    SFMC_ACCESS_TOKEN: SFMC_ACCESS_TOKEN
capability:
  consumes:
  - type: http
    namespace: marketing-cloud-rest
    baseUri: https://YOUR_SUBDOMAIN.rest.marketingcloudapis.com
    description: Salesforce Marketing Cloud REST API for contacts, journeys, and assets.
    authentication:
      type: bearer
      token: '{{SFMC_ACCESS_TOKEN}}'
    resources:
    - name: contacts
      path: /contacts/v1
      description: Contact management operations
      operations:
      - name: create-contacts
        method: POST
        description: Create one or more contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            contactKey: '{{tools.contactKey}}'
            attributeSets: '{{tools.attributeSets}}'
      - name: search-contacts
        method: POST
        description: Search for contacts using filter criteria
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            conditionSet: '{{tools.conditionSet}}'
      - name: get-contact
        method: GET
        description: Retrieve a contact by contact key
        inputParameters:
        - name: contactKey
          in: path
          type: string
          required: true
          description: Unique contact identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-contact
        method: PATCH
        description: Update an existing contact
        inputParameters:
        - name: contactKey
          in: path
          type: string
          required: true
          description: Unique contact identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            attributeSets: '{{tools.attributeSets}}'
      - name: delete-contact
        method: DELETE
        description: Delete a contact
        inputParameters:
        - name: contactKey
          in: path
          type: string
          required: true
          description: Contact key to delete
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: list-attribute-sets
        method: GET
        description: List all attribute sets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: journeys
      path: /interaction/v1
      description: Journey management operations
      operations:
      - name: list-journeys
        method: GET
        description: List journeys with pagination
        inputParameters:
        - name: $page
          in: query
          type: integer
          required: false
          description: Page number
        - name: $pageSize
          in: query
          type: integer
          required: false
          description: Items per page
        - name: status
          in: query
          type: string
          required: false
          description: Filter by status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-journey
        method: POST
        description: Create a new journey
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
            description: '{{tools.description}}'
      - name: get-journey
        method: GET
        description: Retrieve a journey by ID
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: Journey UUID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: update-journey
        method: PUT
        description: Update an existing journey
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: Journey UUID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            name: '{{tools.name}}'
      - name: delete-journey
        method: DELETE
        description: Delete a journey
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: Journey UUID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: publish-journey
        method: POST
        description: Publish a journey asynchronously
        inputParameters:
        - name: id
          in: path
          type: string
          required: true
          description: Journey UUID
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: marketing-automation-api
    description: Unified REST API for marketing automation workflows.
    resources:
    - path: /v1/contacts
      name: contacts
      description: Contact management
      operations:
      - method: POST
        name: create-contacts
        description: Create one or more contacts
        call: marketing-cloud-rest.create-contacts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/contacts/search
      name: contact-search
      description: Contact search
      operations:
      - method: POST
        name: search-contacts
        description: Search contacts by criteria
        call: marketing-cloud-rest.search-contacts
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/contacts/{contactKey}
      name: contact-detail
      description: Single contact operations
      operations:
      - method: GET
        name: get-contact
        description: Get a contact
        call: marketing-cloud-rest.get-contact
        with:
          contactKey: rest.contactKey
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: update-contact
        description: Update a contact
        call: marketing-cloud-rest.update-contact
        with:
          contactKey: rest.contactKey
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-contact
        description: Delete a contact
        call: marketing-cloud-rest.delete-contact
        with:
          contactKey: rest.contactKey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/journeys
      name: journeys
      description: Journey management
      operations:
      - method: GET
        name: list-journeys
        description: List all journeys
        call: marketing-cloud-rest.list-journeys
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: create-journey
        description: Create a journey
        call: marketing-cloud-rest.create-journey
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/journeys/{id}
      name: journey-detail
      description: Single journey operations
      operations:
      - method: GET
        name: get-journey
        description: Get a journey
        call: marketing-cloud-rest.get-journey
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: update-journey
        description: Update a journey
        call: marketing-cloud-rest.update-journey
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: delete-journey
        description: Delete a journey
        call: marketing-cloud-rest.delete-journey
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/journeys/{id}/publish
      name: journey-publish
      description: Journey publishing
      operations:
      - method: POST
        name: publish-journey
        description: Publish a journey
        call: marketing-cloud-rest.publish-journey
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/attribute-sets
      name: attribute-sets
      description: Attribute set definitions
      operations:
      - method: GET
        name: list-attribute-sets
        description: List attribute sets
        call: marketing-cloud-rest.list-attribute-sets
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: marketing-automation-mcp
    transport: http
    description: MCP server for AI-assisted marketing automation.
    tools:
    - name: create-contacts
      description: Create one or more contacts in Marketing Cloud
      hints:
        readOnly: false
      call: marketing-cloud-rest.create-contacts
      with:
        contactKey: tools.contactKey
        attributeSets: tools.attributeSets
      outputParameters:
      - type: object
        mapping: $.
    - name: search-contacts
      description: Search for contacts using filter criteria
      hints:
        readOnly: true
        idempotent: true
      call: marketing-cloud-rest.search-contacts
      with:
        conditionSet: tools.conditionSet
      outputParameters:
      - type: object
        mapping: $.
    - name: get-contact
      description: Retrieve a contact by contact key
      hints:
        readOnly: true
      call: marketing-cloud-rest.get-contact
      with:
        contactKey: tools.contactKey
      outputParameters:
      - type: object
        mapping: $.
    - name: update-contact
      description: Update an existing contact's attributes
      hints:
        readOnly: false
        idempotent: true
      call: marketing-cloud-rest.update-contact
      with:
        contactKey: tools.contactKey
        attributeSets: tools.attributeSets
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-contact
      description: Delete a contact from Marketing Cloud
      hints:
        destructive: true
      call: marketing-cloud-rest.delete-contact
      with:
        contactKey: tools.contactKey
      outputParameters:
      - type: object
        mapping: $.
    - name: list-attribute-sets
      description: List all contact attribute set definitions
      hints:
        readOnly: true
      call: marketing-cloud-rest.list-attribute-sets
      outputParameters:
      - type: object
        mapping: $.
    - name: list-journeys
      description: List customer journeys with filtering and pagination
      hints:
        readOnly: true
      call: marketing-cloud-rest.list-journeys
      outputParameters:
      - type: object
        mapping: $.
    - name: create-journey
      description: Create a new customer journey
      hints:
        readOnly: false
      call: marketing-cloud-rest.create-journey
      with:
        name: tools.name
        description: tools.description
      outputParameters:
      - type: object
        mapping: $.
    - name: get-journey
      description: Retrieve a journey by ID
      hints:
        readOnly: true
      call: marketing-cloud-rest.get-journey
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: update-journey
      description: Update an existing journey specification
      hints:
        readOnly: false
        idempotent: true
      call: marketing-cloud-rest.update-journey
      with:
        id: tools.id
        name: tools.name
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-journey
      description: Delete a journey
      hints:
        destructive: true
      call: marketing-cloud-rest.delete-journey
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
    - name: publish-journey
      description: Publish a journey to activate customer entry
      hints:
        readOnly: false
      call: marketing-cloud-rest.publish-journey
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
