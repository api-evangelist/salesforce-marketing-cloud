"""
Salesforce Marketing Cloud GraphQL Schema
Conceptual schema derived from the Salesforce Marketing Cloud REST API surface.
Covers email sends, automation, contacts, data extensions, journey builder,
content builder, tracking events, and transactional messaging.
"""

# -----------------------------------------------------------------------
# Scalar Types
# -----------------------------------------------------------------------

scalar DateTime
scalar JSON
scalar Upload

# -----------------------------------------------------------------------
# Enum Types
# -----------------------------------------------------------------------

enum SubscriberStatus {
  ACTIVE
  BOUNCED
  HELD
  UNSUBSCRIBED
  DELETED
}

enum EmailSendStatus {
  PENDING
  SENDING
  SENT
  CANCELLED
  ERROR
  SCHEDULED
}

enum AutomationStatus {
  ACTIVE
  INACTIVE
  PAUSED
  ERROR
  SCHEDULED
  RUNNING
  STOPPED
}

enum AutomationRunStatus {
  BUILDING
  EXECUTING
  COMPLETED
  FAILED
  CANCELLED
  SKIPPED
}

enum JourneyStatus {
  DRAFT
  PUBLISHED
  PAUSED
  STOPPED
  DELETED
}

enum JourneyActivityType {
  EMAIL_ACTIVITY
  SMS_ACTIVITY
  PUSH_ACTIVITY
  WAIT_ACTIVITY
  DECISION_SPLIT
  RANDOM_SPLIT
  ENGAGEMENT_SPLIT
  JOIN_ACTIVITY
  GOAL_ACTIVITY
  UPDATE_CONTACT
  SALES_FORCE_ACTIVITY
  REST_DECISION_SPLIT
  CUSTOM_ACTIVITY
}

enum DataExtensionFieldType {
  TEXT
  NUMBER
  DATE
  BOOLEAN
  EMAIL_ADDRESS
  PHONE
  DECIMAL
  LOCALE
}

enum AssetType {
  BLOCK
  TEMPLATE
  EMAIL
  WEBPAGE
  FILE
  IMAGE
  DOCUMENT
  VIDEO
  AUDIO
  BANNER
  PUSH_NOTIFICATION
  SMS
}

enum MessageStatus {
  DRAFT
  ACTIVE
  INACTIVE
  DELETED
}

enum TrackingEventType {
  OPEN
  CLICK
  BOUNCE
  UNSUBSCRIBE
  FORWARD_TO_FRIEND
  SURVEY_RESPONSE
  CONVERSION
  SPAM_COMPLAINT
}

enum BounceType {
  SOFT
  HARD
  TECHNICAL
}

enum ChannelType {
  EMAIL
  SMS
  PUSH
  SOCIAL
  ADVERTISING
  IN_APP
}

enum ContentBlockType {
  HTML
  TEXT
  AMP_SCRIPT
  SMART_CAPTURE
  FREE_FORM
  REFERENCE
}

enum AttributeType {
  TEXT
  NUMBER
  DATE
  BOOLEAN
  EMAIL_ADDRESS
  PHONE
  DECIMAL
}

enum CampaignStatus {
  DRAFT
  ACTIVE
  COMPLETED
  CANCELLED
}

enum NotificationCallbackStatus {
  ACTIVE
  INACTIVE
}

enum SortOrder {
  ASC
  DESC
}

