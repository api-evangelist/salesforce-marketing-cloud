# -----------------------------------------------------------------------
# Query Root
# -----------------------------------------------------------------------

type Query {
  # Subscriber queries
  subscriber(subscriberKey: String!): Subscriber
  subscribers(filter: SubscriberFilterInput, pagination: PaginationInput): SubscriberConnection!

  # Contact queries
  contact(contactKey: String!): Contact
  contacts(pagination: PaginationInput): [Contact!]!

  # Email message queries
  emailMessage(id: ID!): EmailMessage
  emailMessages(pagination: PaginationInput): EmailMessageConnection!

  # Email send definition queries
  emailSendDefinition(id: ID!): EmailSendDefinition
  emailSendDefinitions(pagination: PaginationInput): [EmailSendDefinition!]!

  # Tracking event queries
  trackingEvents(filter: TrackingEventFilterInput, pagination: PaginationInput): TrackingEventConnection!
  trackingEvent(id: ID!): TrackingEvent

  # Data extension queries
  dataExtension(customerKey: String!): DataExtension
  dataExtensions(pagination: PaginationInput): DataExtensionConnection!
  dataExtensionRows(customerKey: String!, filter: JSON, pagination: PaginationInput): [DataExtensionRow!]!

  # Journey queries
  journey(id: ID!): Journey
  journeys(status: JourneyStatus, pagination: PaginationInput): JourneyConnection!
  journeyByKey(key: String!, version: Int): Journey
  journeyContacts(journeyId: ID!, pagination: PaginationInput): [JourneyContact!]!

  # Asset queries
  asset(id: ID!): Asset
  assets(assetType: AssetType, categoryId: Int, pagination: PaginationInput): AssetConnection!
  assetCategory(id: ID!): AssetCategory
  assetCategories: [AssetCategory!]!

  # Automation queries
  automation(id: ID!): Automation
  automations(status: AutomationStatus, pagination: PaginationInput): AutomationConnection!
  automationRun(runId: ID!): AutomationRun
  automationRuns(automationId: ID!, pagination: PaginationInput): [AutomationRun!]!

  # Transactional messaging queries
  transactionalEmailMessage(definitionKey: String!): TransactionalEmailMessage
  transactionalEmailMessages(status: MessageStatus, pagination: PaginationInput): [TransactionalEmailMessage!]!

  # SMS queries
  smsMessage(id: ID!): SMSMessage
  smsMessages(pagination: PaginationInput): [SMSMessage!]!

  # Push notification queries
  pushMessage(id: ID!): PushMessage
  pushMessages(pagination: PaginationInput): [PushMessage!]!

  # Campaign queries
  campaign(id: ID!): Campaign
  campaigns(status: CampaignStatus, pagination: PaginationInput): CampaignConnection!

  # Event notification queries
  eventNotificationCallback(callbackId: ID!): EventNotificationCallback
  eventNotificationCallbacks: [EventNotificationCallback!]!
  eventNotificationSubscription(subscriptionName: String!): EventNotificationSubscription

  # Einstein recommendation queries
  einsteinRecommendation(id: ID!): EinsteinRecommendation
  einsteinRecommendations: [EinsteinRecommendation!]!
}

# -----------------------------------------------------------------------
# Mutation Root
# -----------------------------------------------------------------------

type Mutation {
  # Subscriber mutations
  createSubscriber(input: CreateSubscriberInput!): Subscriber!
  updateSubscriber(subscriberKey: String!, input: UpdateSubscriberInput!): Subscriber!
  deleteSubscriber(subscriberKey: String!): Boolean!
  unsubscribeSubscriber(subscriberKey: String!, listId: String): Boolean!

  # Contact mutations
  createContact(input: CreateContactInput!): Contact!
  upsertContact(input: CreateContactInput!): Contact!
  deleteContact(contactKey: String!): Boolean!

  # Data extension mutations
  createDataExtension(input: CreateDataExtensionInput!): DataExtension!
  updateDataExtension(customerKey: String!, input: CreateDataExtensionInput!): DataExtension!
  deleteDataExtension(customerKey: String!): Boolean!
  upsertDataExtensionRows(customerKey: String!, rows: [UpsertDataExtensionRowInput!]!): Boolean!
  deleteDataExtensionRows(customerKey: String!, keys: [JSON!]!): Boolean!

  # Email send definition mutations
  createEmailSendDefinition(input: CreateEmailSendDefinitionInput!): EmailSendDefinition!
  updateEmailSendDefinition(id: ID!, input: CreateEmailSendDefinitionInput!): EmailSendDefinition!
  deleteEmailSendDefinition(id: ID!): Boolean!
  sendEmail(sendDefinitionId: ID!): EmailSendResult!
  scheduleEmailSend(sendDefinitionId: ID!, scheduledTime: DateTime!): EmailSendDefinition!
  cancelEmailSend(jobId: ID!): Boolean!

  # Journey mutations
  createJourney(input: CreateJourneyInput!): Journey!
