source: >-
  Public registry metadata endpoints (registry.npmjs.org, pypi.org, repo.packagist.org,
  api.nuget.org, search.maven.org, rubygems.org, pub.dev, trunk.cocoapods.org) plus the
  first-party GitHub organization https://github.com/salesforce-marketingcloud
docs: https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/sdks.html
note: >-
  Ownership: every package marked official:true is published from a repository in the
  salesforce-marketingcloud GitHub organization, which Salesforce, Inc. operates for
  Marketing Cloud Engagement. Two distinct generations are visible in the data. The
  server-side "Fuel SDK" family (Node, Python, PHP, Java, Ruby, C#) is ARCHIVED on GitHub
  and its newest release across every registry is 2022-01-14 (Maven) — most are 2016-2019.
  The mobile/client family (MobilePush iOS/Android, React Native, Cordova, Flutter,
  Personalization) is actively released, with 2025-2026 versions. A consumer reading only
  "Salesforce publishes SDKs" would not see that the REST/SOAP server SDKs this repo's
  OpenAPI describes have not shipped a release in three to ten years.
