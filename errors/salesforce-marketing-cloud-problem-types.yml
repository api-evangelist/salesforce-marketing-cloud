soap_faults:
- code: '17'
  message: Rate Limited
  transport: SOAP
  note: >-
    The SOAP API signals throttling as a SOAP fault with code 17, not an HTTP 429. Salesforce
    states throttling "temporarily throttles subsequent SOAP API calls from that account" and
    that "the throttling rate is variable depending on the severity of the impact".
  source: https://developer.salesforce.com/docs/marketing/marketing-cloud/guide/rate-limiting.html
