format: proprietary-json
note: >-
  Marketing Cloud Engagement does NOT use RFC 9457 problem+json. It returns a proprietary
  JSON envelope carrying a numeric errorcode that is independent of the HTTP status, which is
  the field an agent must branch on. The code registry below is transcribed from Salesforce's
  published error reference; only codes and classes Salesforce documents are listed, and where
  the docs give a class range rather than a per-code title that is recorded as a class.
envelope:
  media_type: application/json; charset=utf-8
  schema: '#/components/schemas/ErrorResponse'
  fields:
  - name: message
    type: string
    description: Human-readable error message.
  - name: errorcode
    type: integer
    description: >-
      Numeric Marketing Cloud error code. Distinct from the HTTP status — branch on this,
      not on the status alone.
  - name: documentation
    type: string
    description: URL to the relevant documentation for this error.
  - name: additionalErrors
    type: array
    description: >-
      Present in aggregate/batch scenarios; carries the detailed per-item messages. Documented
      in the error reference, not modelled in the captured OpenAPI.
  example: examples/salesforce-marketing-cloud-error-response-example.json
classes:
- range: 10000-10005
  http_status: 400
  class: Validation errors
  remediation: Correct the request payload or query parameters and retry.
- range: 20000-20002
  http_status: 403
  class: Authorization errors
  remediation: >-
    The token is valid but the Installed Package lacks the required scope. Add the scope in
    Marketing Cloud Setup > Apps > Installed Packages and reissue the token. See
    scopes/salesforce-marketing-cloud-scopes.yml.
- range: 40000-40003
  http_status: 401
  class: Authentication errors
  remediation: >-
    Re-authenticate against https://{subdomain}.auth.marketingcloudapis.com/v2/token. Code 0
    is also documented in this class.
- range: 30000-30004
  http_status: 4xx/5xx
  class: Runtime errors
  remediation: Inspect message and additionalErrors; retry only for transient runtime failures.
