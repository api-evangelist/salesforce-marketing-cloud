generated: '2026-08-13'
method: derived
source: mcp/salesforce-marketing-cloud-mcp.yml + openapi/*.yml
note: 'Binds Salesforce''s published MCE MCP tool list to the OpenAPI operationIds captured in this repo.
  Both sides are real: the tool names and descriptions are transcribed verbatim from Salesforce''s own
  tool reference, and every operationId below was grepped out of the specs in openapi/. Confidence is
  set by NAME AND SEMANTICS ONLY — the live MCP endpoint is tenant-scoped (see mcp/ introspection block),
  so no tool inputSchema could be read and none is asserted. The dominant finding is asymmetry: the MCP
  server covers eleven product areas while this repo holds OpenAPI for three, so 116 of 142 tools have
  no captured REST operation to inherit an input contract from. That is a capture gap on our side for
  most categories, and a genuine MCP-only surface for the journey-activity constructor tools, which hold
  state in the server rather than calling an API.'
surfaces:
  openapi:
    files:
    - openapi/salesforce-marketing-cloud-assets-api-openapi.yml
    - openapi/salesforce-marketing-cloud-contacts-api-openapi.yml
    - openapi/salesforce-marketing-cloud-journeys-api-openapi.yml
    operations: 21
    gated: false
    note: Tenant-templated servers[] (https://{subdomain}.rest.marketingcloudapis.com).
  mcp:
    endpoint: https://mai-mce-mcp-cdp1.sfdc-yfeipo.svc.sfdcfc.net/t/{tenantID}/c/{clientID}/api/mcp
    gated: true
    note: tools/list on the un-tenanted root returns HTTP 405; live schemas need an authenticated tenant.
  graphql:
    endpoint: null
    gated: false
    note: Salesforce publishes NO GraphQL endpoint for Marketing Cloud Engagement. graphql/salesforce-marketing-cloud-schema.graphql
      in this repo is an API Evangelist conceptual schema derived from REST, not a provider surface, and
      is therefore excluded from this crosswalk.
