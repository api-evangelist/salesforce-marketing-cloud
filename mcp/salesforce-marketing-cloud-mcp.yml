      https://mai-mce-mcp-cdp1.sfdc-yzvdd4.svc.sfdcfc.net/t/{tenantID}/c/{clientID}/api/mcp
  install: null
  package: null
  auth: oauth
  verified: probed
  note: >-
    Remote hosted server operated by Salesforce — an agent POSTs to the URL above, there is
    nothing to install. The path is templated per tenant: {tenantID} and {clientID} come from
    an Installed Package created in Marketing Cloud Engagement Setup, so the URL is real but
    tenant-scoped, exactly like the REST baseURL. Verified by probing the server root:
    /.well-known/oauth-authorization-server and /.well-known/oauth-protected-resource both
    return 200 with real RFC 8414 / RFC 9728 documents (saved in well-known/). Salesforce
    publishes an install line for Claude Code:
    "claude mcp add -s user --transport http CONFIG_NAME
    https://mai-mce-mcp-cdp1.sfdc-yfeipo.svc.sfdcfc.net/t/{tenantID}/c/{clientID}/api/mcp"
    — that is a client-side registration of the REMOTE URL, not a local stdio package.
