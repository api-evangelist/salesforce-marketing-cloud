meters:
- name: user_subscription
  unit: seat-month
  aggregation: sum
  dimensions:
  - edition
  - license_type
  - org
- name: api_requests
  unit: request
  aggregation: sum
  dimensions:
  - edition
  - org
  - named_credential
- name: data_storage
  unit: GB-month
  aggregation: max
  dimensions:
  - org
  - object
- name: file_storage
  unit: GB-month
  aggregation: max
  dimensions:
  - org
principles:
- name: Visibility
  description: Monitor Setup > System Overview for licensed users, API requests over the trailing 24 hours,
    and data/file storage. Use the Event Monitoring (Shield) API for per-user request telemetry where
    licensed.
- name: Allocation
  description: Tag each consuming integration with a Connected App / Named Credential and attribute API
    consumption by Connected App in Event Monitoring.
- name: Optimization
  description: Reduce API consumption by using Composite, SOQL Query, and Bulk API 2.0 instead of per-record
    REST calls; right-size editions at renewal; archive to Big Objects to reduce data-storage overage.
- name: Accountability
  description: CRM platform owner is accountable for per-org consumption and renewal terms; integration
    owners are accountable for staying within the org-wide 24-hour API quota.
notes: Salesforce publishes per-edition pricing on its product pages, but those pages are not retrievable
  via automated fetch (HTTP 403). All editions are sold via Salesforce Sales; API access is included with
  the underlying CRM license rather than priced as a discrete API SKU. Treat this artifact as a contact-sales
  placeholder until pricing pages can be reconciled manually.
