notes: >-
  What the pricing page does NOT publish, and what therefore cannot be recorded here: any API
  call quota, any overage rate, any per-message or per-contact metering, and any mapping from
  edition to API request limits. Salesforce's rate-limit documentation likewise publishes no
  numeric ceiling for Marketing Cloud Engagement (see
  rate-limits/salesforce-marketing-cloud-rate-limits.yml). A buyer can therefore price the
  licence from the public page but cannot price or plan the API usage from anything public.
  All prices are USD list, "Starting price" where the page says so, and are subject to
  Salesforce sales negotiation.
