description: Plans/pricing artifact for Salesforce Marketing Cloud. Trimmed to a single Contact Sales
  entry pending manual reconciliation. Salesforce publishes per-edition pricing on its product pages,
  but those pages are not retrievable via automated fetch (HTTP 403). All editions are sold via Salesforce
  Sales; API access is included with the underlying CRM license rather than priced as a discrete API SKU.
  Treat this artifact as a contact-sales placeholder until pricing pages can be reconciled manually.
sources:
- https://www.salesforce.com/marketing/pricing/
plans:
- id: salesforce-marketing-cloud-contact-sales
  name: Contact Sales
  type: enterprise
  description: Salesforce Marketing Cloud pricing is not publicly retrievable; access is sold through
    Salesforce, Inc. sales. See https://www.salesforce.com/marketing/pricing/ for the published pricing
    page and contact the vendor for a quote.
  entries:
  - label: Contact Sales
    name: contact_sales
    type: flat
    metric: varies
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
  elements:
  - name: Quote-Based Pricing
  - name: Vendor Sales Engagement
notes: Salesforce publishes per-edition pricing on its product pages, but those pages are not retrievable
