description: >-
  Published list pricing for the Salesforce Marketing Cloud line, read from
  https://www.salesforce.com/marketing/pricing/ on 2026-08-13 (HTTP 200, 592 KB). This
  supersedes the 2026-05-04 bulk-sweep placeholder that recorded "pricing is not publicly
  retrievable" after a 403 — Salesforce does publish per-edition list prices, in seven
  currencies, with a currency switcher. Prices are USD list, transcribed verbatim. Marketing
  Cloud Engagement — the product whose APIs this repo profiles — is now sold as the
  Engagement+ add-on on top of a Marketing Cloud Next edition, which is why the core-suite
  tiers and the add-ons are recorded separately below. API access is included with the
  license; there is no discrete API SKU and no per-call price.
sources:
- https://www.salesforce.com/marketing/pricing/
currencies_published: [USD, EUR, GBP, AUD, JPY, SEK]
plan_count: 10
