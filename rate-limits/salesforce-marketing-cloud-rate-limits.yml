description: Rate-limits artifact for Salesforce Marketing Cloud. Trimmed to a single umbrella entry pending
  manual reconciliation. Salesforce publishes per-edition pricing on its product pages, but those pages
  are not retrievable via automated fetch (HTTP 403). All editions are sold via Salesforce Sales; API
  access is included with the underlying CRM license rather than priced as a discrete API SKU. Treat this
  artifact as a contact-sales placeholder until pricing pages can be reconciled manually.
sources:
- https://www.salesforce.com/marketing/pricing/
responseCodes:
  throttled: 429
  quotaExceeded: 429
  serviceUnavailable: 503
limits:
- name: Per-edition 24-hour API request limit
  scope: org/edition
  metric: varies
  limit: varies by Salesforce edition (Developer / Professional / Enterprise / Performance / Unlimited)
    and licensed user count; see Salesforce App Limits Cheatsheet
  notes: Salesforce documents per-edition 24-hour API request totals plus add-on packs; the public docs
    page is gated and returned no scrape-able content.
policies:
- name: Per-Edition Quota
  description: Salesforce APIs share a single org-wide 24-hour quota driven by edition and licensed user
    count, with API Request Limits visible in Setup > System Overview.
- name: Concurrent API Request Limit
  description: Salesforce caps concurrent long-running API requests per org; specific numbers are documented
    in the Salesforce App Limits Cheatsheet.
- name: Backoff Strategy
  description: When a 429 is returned, clients should honor Retry-After and apply exponential backoff
    with jitter.
notes: Salesforce publishes per-edition pricing on its product pages, but those pages are not retrievable
  via automated fetch (HTTP 403). All editions are sold via Salesforce Sales; API access is included with
  the underlying CRM license rather than priced as a discrete API SKU. Treat this artifact as a contact-sales
  placeholder until pricing pages can be reconciled manually.
