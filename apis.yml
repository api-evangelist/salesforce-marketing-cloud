name: Salesforce Marketing Cloud
description: >-
  Salesforce Marketing Cloud Engagement is an enterprise digital marketing platform for
  customer journeys, email marketing, mobile messaging (SMS/MMS and push), advertising,
  content management and marketing data. Its API surface is tenant-scoped: every REST call
  goes to https://{subdomain}.rest.marketingcloudapis.com and every SOAP call to
  https://{subdomain}.soap.marketingcloudapis.com, with OAuth 2.0 tokens issued per tenant
  from https://{subdomain}.auth.marketingcloudapis.com/v2/token and scopes granted to an
  Installed Package rather than requested at authorization time. Product areas are versioned
  independently at v1 behind route prefixes (/asset, /contacts, /interaction, /data,
  /messaging, /push, /sms, /automation, /hub, /platform). Salesforce also operates a
  first-party hosted MCP server for Marketing Cloud Engagement, generally available since
  June 2026, exposing 142 tools across eleven product areas, and an outbound webhook product,
  the Event Notification Service, with HMAC-SHA256 signed callbacks.
